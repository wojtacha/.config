############################################################################

############################################################################
# Reset Prefix
############################################################################
set -g prefix C-a

############################################################################
# Global options
############################################################################
# Fix ctrl+left/right keys work right
set-window-option -g xterm-keys on

# set-option -g default-terminal 'screen-256color
# set-option -g terminal-overrides ',xterm-256color:RGB'
# set-option -ga terminal-overrides ",xterm-256color:Tc"
# set-option -sa terminal-features ',XXX:RGB'

# allow terminal scrolling
# set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'


set -g default-terminal "alacritty"
# start window indexing at one instead of zero
set -g base-index 1

# split panes using "|" and "_"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# vim-like pane resizing
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt

bind -r c neww -c "#{pane_current_path}"

# change window with arrows 
bind -n C-S-Left prev
bind -n C-S-Right next
bind -n C-S-M-Left swap-window -t -1\; select-window -t -1
bind -n C-S-M-Right swap-window -t +1\; select-window -t +1

# forget the find window.  That is for chumps. This works as command+f see alacritty settings.
bind -r C-f run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"
bind -r C-i run-shell "tmux neww ~/.config/tmux/scripts/tmux-chsh"

# vim-integration
set-option -g focus-events on

# colon :
bind : command-prompt

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# set -g utf8 on
# use mouse in copy mode
set -g mouse on

############################################################################
# Unbindings
############################################################################
# remove default binding since replacing
unbind %
unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right


############################################################################
# nVIM coop
############################################################################

set -g detach-on-destroy off 

set-option -sg escape-time 10

########################################
# Define my custom menu bar
########################################
set-option -g status on                # turn the status bar on
# set -g status-utf8 on                  # set utf-8 for the status bar
set -g status-interval 5               # set update frequencey (default 15 seconds)
# set-option -g status-position top    # position the status bar at top of screen

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity off


set -g window-status-bell-style bg=default,underscore,fg=brightred,underscore
 
set -g window-status-activity-style bg=default,underscore,fg=brightblue,underscore

# set -g @tmux_colorful_color_scheme 'https://coolors.co/ff4e00-8ea604-f5bb00-ec9f05-bf3100'
# set -g @tmux_colorful_plugins "network cpu battery"

set-option -g renumber-windows on



# THIS IS NEW
# set -g mode-style "fg=#82aaff,bg=#3b4261"
#
# set -g message-style "fg=#82aaff,bg=#3b4261"
# set -g message-command-style "fg=#82aaff,bg=#3b4261"
#
# set -g pane-border-style "fg=#3b4261"
# set -g pane-active-border-style "fg=#82aaff"
#
# set -g status "on"
# set -g status-justify "left"
#
# set -g status-style "fg=#82aaff,bg=#1e2030"
set -g status-style 'bg=default'      

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left " #[fg=#FEF8F2,bg=#1e2030,bold] #S #[fg=#FEF8F2,bg=#1e2030,nobold,nounderscore,noitalics]"

set -g status-right '#(gitmux -cfg $HOME/.config/tmux/gitmux.conf "#{pane_current_path}")'

setw -g window-status-activity-style "underscore,fg=#828bb8,bg=#1e2030"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=#1e2030"
setw -g window-status-format "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[default] #I | #W #F #[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#ffffff,bg=#3b4261,bold] [#I : #W #F] #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#ffa777]#[bg=#1e2030]#[fg=#1e2030]#[bg=#ffa777]"
set -g @prefix_highlight_output_suffix ""
